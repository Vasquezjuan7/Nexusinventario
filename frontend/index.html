<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Inventory - Logística y Gestión Amazon Style</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card fade-in">
            <div class="logo-icon" style="margin: 0 auto 1.5rem; width: 60px; height: 60px;">
                <i data-lucide="package" style="width: 30px; height: 30px;"></i>
            </div>
            <h1 style="margin-bottom: 0.5rem;">Nexus Inventory</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Acceso al sistema de gestión de almacenes</p>
            <form id="login-form" onsubmit="app.handleLogin(event)">
                <div class="form-group" style="text-align: left;">
                    <label>Usuario Corporativo</label>
                    <input type="text" class="form-control" value="admin@nexus.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Token de Acceso</label>
                    <input type="password" class="form-control" value="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Entrar al Nexo</button>
            </form>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">
                <i data-lucide="box"></i>
            </div>
            <span class="logo-text">Nexus</span>
        </div>
        
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="app.showPage('dashboard')">
                <i data-lucide="line-chart"></i>
                Dashboard
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('products')">
                <i data-lucide="shopping-bag"></i>
                Productos
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('warehouses')">
                <i data-lucide="warehouse"></i>
                Almacenes
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('orders')">
                <i data-lucide="truck"></i>
                Pedidos
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('customers')">
                <i data-lucide="user-circle"></i>
                Clientes
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('suppliers')">
                <i data-lucide="users"></i>
                Proveedores
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('categories')">
                <i data-lucide="layers"></i>
                Categorías
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('reports')">
                <i data-lucide="file-bar-chart"></i>
                Reportes
            </a>
            <a href="#" class="nav-item" onclick="app.showPage('settings')" style="margin-top: auto;">
                <i data-lucide="settings"></i>
                Configuración
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-layout">
        <header class="header">
            <div class="search-bar" style="width: 400px;">
                <input type="text" class="form-control" placeholder="Buscar productos, SKUs o pedidos..." onkeyup="app.globalSearch(this.value)">
            </div>
            <div class="user-profile" style="display: flex; align-items: center; gap: 1rem;">
                <div style="text-align: right;">
                    <p style="font-weight: 600; font-size: 0.9rem;">Admin Nexus</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Warehouse Manager</p>
                </div>
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: var(--secondary);">
                    <i data-lucide="user-cog"></i>
                </div>
            </div>
        </header>

        <section id="content" class="content-area">
            <!-- Dynamic Content Load Here -->
        </section>
    </main>

    <!-- Modals -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 1.5rem;">Cargar Nuevo Producto</h2>
            <form onsubmit="app.saveProduct(event)">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="prod-name" class="form-control" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>SKU / Código</label>
                        <input type="text" id="prod-sku" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="prod-cat" class="form-control">
                            <option>Electrónica</option><option>Hogar</option><option>Ropa</option><option>Libros</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Stock Inicial</label>
                        <input type="number" id="prod-stock" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Precio Venta ($)</label>
                        <input type="number" step="0.01" id="prod-price" class="form-control" required>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" style="flex: 1;" onclick="app.closeModal('product-modal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Registrar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/seed-inline.js"></script>
    <script>window.NEXUS_SEED = initialState;</script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
